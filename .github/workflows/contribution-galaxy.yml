name: Contribution Galaxy

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-galaxy.mjs"
      - ".github/workflows/contribution-galaxy.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Generate from the live GitHub contribution calendar.
concurrency:
  group: contribution-galaxy
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Render galaxy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GALAXY_USER: SamSurve
        run: node scripts/generate-galaxy.mjs --out assets/contribution-galaxy.svg

      - name: Commit galaxy (SVG only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-galaxy.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update contribution galaxy"
          git pull --rebase origin main
          git push
